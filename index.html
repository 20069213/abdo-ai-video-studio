
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDO AI VIDEO STUDIO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>👑 ABDO AI</h1>
        <p>AI VIDEO STUDIO</p>
        <span class="status">● SYSTEM READY</span>
    </header>

    <main class="container">

        <section class="panel">
            <h2>إنشاء فيديو بالذكاء الاصطناعي</h2>

            <label for="prompt">اكتب وصف الفيديو</label>
            <textarea id="prompt" placeholder="مثال: مدينة جميلة وقت الغروب..."></textarea>

            <label for="imageInput">اختر صورة (اختياري)</label>
            <input type="file" id="imageInput" accept="image/*">

            <button id="analyzeButton">تحليل وصف الفيديو</button>

            <div id="result" class="result">
                نتيجة التحليل ستظهر هنا
            </div>
        </section>

        <section class="panel">
            <h2>معاينة الصورة</h2>
            <img id="preview" alt="معاينة الصورة" hidden>
        </section>

    </main>

    <footer>
        <p>ABDO AI VIDEO STUDIO © 2026</p>
        <p>Our Own AI Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
